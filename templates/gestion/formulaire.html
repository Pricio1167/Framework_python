{% extends 'base.html' %}
{% block content %}
<div class="page-heading"><div><span class="eyebrow">Saisie et mise à jour</span><h1>{{ titre }}</h1><p>Vérifiez les informations avant d’enregistrer.</p></div><a href="{% url 'gestion_liste' slug %}" class="btn btn-outline-primary"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Retour à la liste</a></div>
<section class="card form-surface"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button class="btn btn-primary"><i class="bi bi-check2 me-2" aria-hidden="true"></i>Enregistrer</button><a href="{% url 'gestion_liste' slug %}" class="btn btn-outline-secondary">Annuler</a></div></form></section>
{% endblock %}
